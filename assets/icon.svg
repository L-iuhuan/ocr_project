<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Document body -->
  <rect x="128" y="176" width="256" height="224" rx="24" ry="24" fill="#fff" opacity="0.95"/>
  <!-- Document fold corner -->
  <path d="M336 176 L336 224 L384 224 Z" fill="#E2E8F0"/>
  <path d="M336 176 L384 224" stroke="#CBD5E1" stroke-width="2" fill="none"/>

  <!-- OCR eye / scan lens -->
  <circle cx="256" cy="220" r="64" fill="none" stroke="url(#scan)" stroke-width="5" opacity="0.9"/>
  <!-- Eye pupil/scan dot -->
  <circle cx="256" cy="220" r="16" fill="#06B6D4"/>

  <!-- Scan beam across eye -->
  <rect x="192" y="216" width="128" height="8" rx="4" fill="url(#scan)" opacity="0.7">
    <animate attributeName="x" values="192;300;192" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Document text lines -->
  <rect x="160" y="304" width="192" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="160" y="324" width="152" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="160" y="344" width="176" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="160" y="364" width="128" height="8" rx="4" fill="#E2E8F0"/>

  <!-- OCR text bottom -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff" letter-spacing="4">OCR</text>
</svg>
