name: macOS build verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: TypeScript compile (main process + CLI/MCP)
        run: npx tsc -p tsconfig.json

      - name: Vite build (renderer + electron main/preload)
        run: npx vite build

      - name: Verify MCP server artifact
        run: test -f dist-electron/mcp-server.js

      - name: Package macOS app (unsigned)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc codesign (prevent "damaged" error)
        run: |
          APP="$(ls -d release/mac*/OCRFlow.app 2>/dev/null || ls -d release/*.app 2>/dev/null || echo '')"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "ad-hoc signed: $APP"
          else
            echo "No .app bundle found for signing (may be in zip already)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocrflow-macos
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: warn
